
<div
  class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-slate-900/40 backdrop-blur-sm sm:items-center sm:p-4"
  (mousedown)="$event.target === $event.currentTarget && closeModal()"
  (keydown.escape)="closeModal()"
>
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-task-heading"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    class="animate-fade-up w-full max-w-md overflow-hidden rounded-t-3xl bg-white shadow-2xl shadow-slate-900/20 motion-reduce:animate-none sm:rounded-3xl"
  >
    <form
      (submit)="$event.preventDefault(); save.emit({ title: todo.title, description: todo.description ?? '' })"
    >
      <!-- Header -->
    <div class="flex items-center justify-between gap-3 border-b border-slate-100 px-6 py-4">
  <div class="flex items-center gap-3">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-red-50 text-red-600">
      <mat-icon>delete</mat-icon>
    </span>

    <div>
      <h3 id="edit-task-heading" class="text-lg font-semibold text-slate-900">
        Delete task
      </h3>
      <p class="mt-1 text-sm text-slate-500">
        This task will be moved to the trash.
      </p>
    </div>
  </div>

        <button
          type="button"
          aria-label="Close"
          class="grid h-9 w-9 place-items-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
          (click)="closeModal()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>



      <!-- Actions -->
      <div class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4">
        <button
          type="button"
          class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-200/70"
          (click)="closeModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500"
        >
          Delete
        </button>
      </div>
    </form>
  </div>
</div>
