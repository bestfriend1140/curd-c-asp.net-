<div
  class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-slate-900/40 backdrop-blur-sm sm:items-center sm:p-4"
  (mousedown)="$event.target === $event.currentTarget && closeModal()"
  (keydown.escape)="closeModal()"
>
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="empty-trash-heading"
    aria-describedby="empty-trash-description"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    class="animate-fade-up w-full max-w-md overflow-hidden rounded-t-3xl bg-white shadow-2xl shadow-slate-900/20 motion-reduce:animate-none sm:rounded-3xl"
  >
    <div class="flex items-center justify-between gap-3 border-b border-slate-100 px-6 py-4">
      <div class="flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-red-50 text-red-600">
          <mat-icon>delete_forever</mat-icon>
        </span>

        <h2 id="empty-trash-heading" class="text-lg font-semibold text-slate-900">
          Empty trash
        </h2>
      </div>

      <button
        type="button"
        aria-label="Close"
        class="grid h-9 w-9 place-items-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
        (click)="closeModal()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="px-6 py-5">
      <p id="empty-trash-description" class="text-sm text-slate-600">
        This will permanently delete all items in your trash. This action cannot be undone.
      </p>
    </div>

    <div class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4">
      <button
        type="button"
        class="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-200/70"
        (click)="closeModal()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-red-500"
        (click)="confirmEmpty()"
      >
        Empty trash
      </button>
    </div>
  </div>
</div>
