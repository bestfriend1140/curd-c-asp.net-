<header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/75 backdrop-blur-xl">
  <mat-toolbar class="app-toolbar mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:px-6">
    <a routerLink="/main" class="group flex items-center gap-2.5 no-underline">
      <span
        class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30 transition-transform duration-200 group-hover:scale-105"
      >
        <mat-icon class="icon-sm">task_alt</mat-icon>
      </span>
      <span class="text-lg font-semibold tracking-tight text-slate-900">
        Todo<span class="text-indigo-600">Flow</span>
      </span>
    </a>

    <span class="flex-1"></span>

    <nav class="hidden items-center gap-1 sm:flex">
      <a
        mat-button
        routerLink="/main"
        routerLinkActive="active-nav"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-full"
      >
        Home
      </a>
      <a mat-button routerLink="/todo" routerLinkActive="active-nav" class="rounded-full">Todos</a>
          <a
        mat-button
        routerLink="/bin"
        routerLinkActive="active-nav"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-full"
      >
        Recycle Bin
      </a>
    </nav>

    <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></span>

    @if (auth.isLoggedIn()) {
      <div class="flex items-center gap-2">
        <span class="hidden items-center gap-2 rounded-full bg-slate-100 py-1 pl-1 pr-3 sm:flex">
          <span
            class="grid h-7 w-7 place-items-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 text-xs font-semibold uppercase text-white"
          >
            {{ auth.user()?.username?.charAt(0) }}
          </span>
          <span class="text-sm font-medium text-slate-700">{{ auth.user()?.username }}</span>
        </span>
        <button mat-stroked-button type="button" (click)="logout()" class="rounded-full">
          <mat-icon class="icon-sm mr-1">logout</mat-icon>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    } @else {
      <div class="flex items-center gap-2">
        <a mat-button routerLink="/login" class="rounded-full">Login</a>
        <a mat-flat-button color="primary" routerLink="/register" class="rounded-full">
          Get started
        </a>
      </div>
    }
  </mat-toolbar>
</header>

<main class="relative min-h-[calc(100vh-64px)] overflow-hidden">
  <router-outlet />
</main>
